{% extends 'website_dashboard/web_base.html' %}
{% load static %}

{% block title %}Yangi Sertifikat{% endblock %}

{% block content %}
<style>
    .color_red{
        background-color: rgb(211, 31, 31);
    }
    .color_blue{
        background-color: rgb(5, 5, 97) !important;
    }
    .color_w{
        color: aliceblue;
    }
</style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="row">
            <div class="col-3">

            </div>
       
            <div class="col-3">

            </div>
            <div class="col-3">

               
            </div>
        </div>
    </div>
</div>


    <div class="row justify-content-center">
        <div class="col-md-8">
                      <div class="col-3">

                        <a class="btn btn-outline-primary" href="/front/sertificate-list-list/">Sertifikat</a>
                    </div>
                    <br>
               

            
                <div class="card shadow ">
              
                <div class="color_red card-header text-white">
                    <h4 class="mb-0 color_red">Sertifikat yaratish</h4>
                </div>

                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}

                        <!-- Ism -->
                        <div class="mb-3">
                            <label class="form-label">Ism</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>

                        <!-- Familiya -->
                        <div class="mb-3">
                            <label class="form-label">Familiya</label>
                            <input type="text" name="last_name" class="form-control" required>
                        </div> 
                         <div class="mb-3">
                            <label class="form-label">Direktori</label>
                            <input type="text" name="director" class="form-control" required>
                        </div>

                        <!-- Sertifikat raqami -->
                        <div class="mb-3">
                            <label class="form-label">Sertifikat raqami</label>
                            <input type="number" name="n" class="form-control" value="{{sertificate}}" required>
                        </div>

                        <!-- Sana -->
                        <div class="mb-3">
                            <label class="form-label">Sana</label>
                            <input type="date" name="date" class="form-control" required value="{% now 'Y-m-d' %}">

                        </div>

                        <!-- Baholar -->
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Psixologiya</label>
                                <input type="number" name="psixologiya" class="form-control" min="0" max="100" required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Farmokologiya</label>
                                <input type="number" name="Farmokologiya" class="form-control" min="0" max="100" required>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Amaliyot</label>
                                <input type="number" name="Amaliyot" class="form-control" min="0" max="100" required>
                            </div>
                        </div>

                        <!-- A’lo baho -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" name="good_grade" id="good_grade">
                            <label class="form-check-label" for="good_grade">
                                A’lo baho
                            </label>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn color_blue w-100">
                            <span class="color_w">Sertifikat yaratish</span>
                        </button>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html'%}
{% block content %}
{% load static %}

    <style>
        .afm-vacancy-container {
            max-width: 1200px;
            margin: 40px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            padding: 20px;
        }

        .afm-vacancy-card {
            flex: 1;
            min-width: 280px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 24px;
            transition: all 0.3s ease;
            border: 1px solid #eef2f6;
        }

        .afm-vacancy-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .afm-vacancy-title {
            font-size: 20px;
            color: #2C3E50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }

        .afm-vacancy-title i {
            color: #E31E24;
            font-size: 24px;
        }

        .afm-vacancy-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .afm-vacancy-detail {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4A5568;
            font-size: 15px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f2f5;
        }

        .afm-vacancy-detail i {
            width: 20px;
            color: #E31E24;
            font-size: 16px;
        }

        .afm-vacancy-detail:last-child {
            border-bottom: none;
        }

        .afm-vacancy-salary {
            color: #2971f5;
            font-weight: 500;
        }

        .afm-vacancy-phone {
            color: #E31E24;
            font-weight: 500;
            text-decoration: none;
        }

        .afm-vacancy-phone:hover {
            text-decoration: underline;
        }

        /* Application Form Styles */
        .afm-application-container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            border: 1px solid #eef2f6;
        }
        
        .afm-application-title {
            text-align: center;
            margin-bottom: 30px;
            color: #2C3E50;
            font-size: 24px;
            position: relative;
        }
        
        .afm-application-title:after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: #E31E24;
            margin: 10px auto 0;
        }
        
        .afm-form-group {
            margin-bottom: 20px;
        }
        
        .afm-form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2C3E50;
        }
        
        .afm-form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .afm-form-control:focus {
            border-color: #E31E24;
            outline: none;
        }
        
        .afm-form-file {
            padding: 10px 0;
        }
        
        .afm-form-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background: #E31E24;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .afm-form-submit:hover {
            background: #c91a1e;
        }

        /* Custom File Input Styling */
        .custom-file-upload {
            position: relative;
            display: block;
            overflow: hidden;
            margin-top: 10px;
        }

        .file-upload-btn {
            display: inline-block;
            padding: 10px 15px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #2C3E50;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .file-upload-btn:hover {
            background: #e9e9e9;
            border-color: #ccc;
        }

        .file-upload-btn i {
            margin-right: 5px;
            color: #E31E24;
        }

        .file-name-display {
            display: inline-block;
            font-size: 14px;
            color: #666;
            padding: 5px 0;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: middle;
        }

        .custom-file-upload input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 0.1px;
            height: 0.1px;
            z-index: -1;
        }

        @media (max-width: 1200px) {
            .afm-vacancy-card {
                flex: 0 0 calc(33.333% - 24px);
            }
        }

        @media (max-width: 992px) {
            .afm-vacancy-card {
                flex: 0 0 calc(50% - 24px);
            }
        }

        @media (max-width: 768px) {
            .afm-vacancy-container {
                gap: 16px;
                padding: 15px;
            }

            .afm-vacancy-card {
                flex: 0 0 100%;
                padding: 20px;
            }

            .afm-vacancy-title {
                font-size: 18px;
            }

            .afm-vacancy-detail {
                font-size: 14px;
            }
            
            .afm-application-container {
                padding: 20px;
            }
        }
    </style>

    <div class="afm-vacancy-container">
        {% for i in vacancy %}
        <div class="afm-vacancy-card">
            <h2 class="afm-vacancy-title">
                <i class="fas fa-notes-medical"></i>
                {{i.title}}
            </h2>
            <div class="afm-vacancy-info">
                <div class="afm-vacancy-detail">
                    <i class="fas fa-user"></i>
                    <span>{{i.age}}</span>
                </div>
                <div class="afm-vacancy-detail">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>{{i.address}}</span>
                </div>
                <div class="afm-vacancy-detail">
                    <i class="fas fa-clock"></i>
                    <span>{{i.shift}}</span>
                </div>
                <div class="afm-vacancy-detail">
                    <i class="fas fa-money-bill-wave"></i>
                    <span class="afm-vacancy-salary">{{i.salary}}</span>
                </div>
                <div class="afm-vacancy-detail">
                    <i class="fas fa-phone"></i>
                    <a href="tel:+998999091282" class="afm-vacancy-phone">{{i.phone_number}}</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="afm-application-container">
        <h2 class="afm-application-title">Заполните анкету</h2>
        
        <form action="{% url 'VacancyApplication_apteka_url' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    
    <div class="afm-form-group">
        <label for="fio" class="afm-form-label">Ф.И.О.</label>
        <input type="text" name="fio" id="fio" class="afm-form-control" required>
    </div>
    
    <div class="afm-form-group">
        <label for="date_of_birth" class="afm-form-label">Дата рождения</label>
        <input type="date" name="date_of_birth" id="date_of_birth" class="afm-form-control" required>
    </div> 
    
    <div class="afm-form-group">
        <label for="address" class="afm-form-label">Адрес проживания</label>
        <input type="text" name="address" id="address" class="afm-form-control" required>
    </div>
    
    <div class="afm-form-group">
        <label for="education" class="afm-form-label">Образование</label>
        <input type="text" name="education" id="education" class="afm-form-control" required>
    </div>
    
    <div class="afm-form-group">
        <label for="last_job" class="afm-form-label">Последнее место работы</label>
        <input type="text" name="last_job" id="last_job" class="afm-form-control">
    </div>
    
    <div class="afm-form-group">
        <label for="desired_salary" class="afm-form-label">Желаемая зарплата</label>
        <input type="number" step="0.01" name="desired_salary" id="desired_salary" class="afm-form-control" required>
    </div>
    
    <div class="afm-form-group">
        <label for="phone_number" class="afm-form-label">Номер телефона для связи</label>
        <input type="text" name="phone_number" id="phone_number" class="afm-form-control" required>
    </div>

    <button type="submit" class="afm-form-submit">
        <i class="fas fa-paper-plane"></i> Отправить анкету
    </button>
</form>

    </div>

   <script>

    });

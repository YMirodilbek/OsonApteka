{% extends 'base.html' %}
{% block content %}
    <style>
        .container_2 {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .cardp {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 300px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .cardp:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        
        .cardp h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .cardp p {
            margin: 10px 0;
            color: #555;
            font-size: 0.95rem;
        }
        
        .cardp i {
            margin-right: 8px;
            width: 20px;
            text-align: center;
        }
        
        .cardp strong {
            color: #2c3e50;
        }
        
        @media (max-width: 768px) {
            .container_2 {
                padding: 10px;
            }
            
            .cardp {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>

    <div class="container_2">
        {% for i in landlords %}
        <div class="cardp">
            <h1>{{i.title}}</h1>
            <p><i class="fas fa-phone" style="color: red;"></i> <strong>Telefon-1:</strong> {{i.phone_number_1}}</p>
            <p><i class="fas fa-phone-volume" style="color: red;"></i> <strong>Telefon-2:</strong> {{i.phone_number_2}}</p>
            <p><i class="fas fa-map-marker-alt" style="color: red;"></i> <strong>Adress:</strong> {{i.address}}</p>
        </div>
        {% endfor %}    

    </div>
{% endblock %}

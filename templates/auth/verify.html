    body {

        align-items: center;
        height: 100vh;
        margin: 0;
        background: #f5f5f5;
        font-family: 'Arial', sans-serif;
    }
    
    .timer-container {
        text-align: center;
    }
    
    .timer {
        font-size: 24px;
        font-weight: bold;
        color: #ff4757;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        margin-bottom: 20px;
    }
    
    .timer-label {
        font-size: 24px;
        color: #333;
    }
    
    /* Qo'shimcha animatsiya */
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
    
    .timer {
        animation: pulse 1s infinite;
    }
</style>

<body>

        <ul>
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
        <h3>Telefon raqamga kod yuborildi: {{ phone_number }}</h3>
        
        <form  id="myInput" method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <input type="submit" class="button"    value="Tasdiqlash">
      </form>
      <br>

    </div>
  </div>

        const COUNTDOWN_DURATION = 60; // 60 soniya
        const RESET_TIME = 1 * 60 * 1000; // 3 daqiqa (ms)

        // 2. O'zgaruvchilar
        let timeLeft;
        const countdownElement = document.getElementById('countdown');
        const inputElement = document.getElementById('myInput');
        // 3. Timer holatini tekshirish
        const checkTimerState = () => {
            const lastResetTime = sessionStorage.getItem('lastResetTime');
            const currentTime = new Date().getTime();

            // Agar 3 daqiqa o'tgan bo'lsa yoki birinchi marta kirilsa
            if (!lastResetTime || (currentTime - lastResetTime > RESET_TIME)) {
                sessionStorage.setItem('lastResetTime', currentTime);
                timeLeft = COUNTDOWN_DURATION;
            } else {
                // Agar vaqt o'tmagan bo'lsa, oldingi holatda davom et
                const savedTime = sessionStorage.getItem('timerTime');
                timeLeft = savedTime ? parseInt(savedTime) : COUNTDOWN_DURATION;
            }
        };

        // 4. Timerni boshlash
        const startTimer = () => {
            checkTimerState();
            countdownElement.textContent = timeLeft;

            const timer = setInterval(() => {
                timeLeft--;
                countdownElement.textContent = timeLeft;
                sessionStorage.setItem('timerTime', timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdownElement.textContent = "Vaqt tugadi!";
                    inputElement.style.display = 'none';
                    COUNTDOWN_DURATION.style.display = "none"
                }
            }, 1000);
        };

        // Sahifa yuklanganda boshlash
        window.onload = startTimer;
  </script>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Chat</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            height: 100vh;
            display: flex;
        }
        /* Users list styles */
        .users-list {
            width: 350px;
            background-color: #fff;
            border-right: 1px solid #e9edef;
            overflow-y: auto;
        }
        .user-search {
            padding: 10px;
            background-color: #0088cc;
        }
        .user-item {
            padding: 10px 15px;
            border-bottom: 1px solid #e9edef;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .user-item:hover {
            background-color: #f5f5f5;
        }
        .user-item.active {
            background-color: #e9edef;
        }
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #555;
        }
        .user-info {
            flex: 1;
        }
        .user-name {
            font-weight: 500;
            margin-bottom: 3px;
        }
        .last-message {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .message-time {
            font-size: 12px;
            color: #999;
        }
        
        /* Chat area styles */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background-color: #f0f2f5;
            padding: 15px;
            border-bottom: 1px solid #e9edef;
            display: flex;
            align-items: center;
        }
        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #555;
        }
        .chat-title {
            font-weight: 500;
        }
        .chat-status {
            font-size: 13px;
            color: #666;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: #e5ddd6;
            background-attachment: fixed;
        }
        .message {
            margin-bottom: 15px;
            max-width: 70%;
            position: relative;
        }
        .received {
            align-self: flex-start;
            background-color: #fff;
            border-radius: 0 8px 8px 8px;
            padding: 8px 12px;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .sent {
            align-self: flex-end;
            background-color: #dcf8c6;
            border-radius: 8px 0 8px 8px;
            padding: 8px 12px;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .message-time {
            font-size: 11px;
            color: #666;
            text-align: right;
            margin-top: 3px;
        }
        .chat-input {
            padding: 10px;
            background-color: #f0f2f5;
            border-top: 1px solid #e9edef;
        }
        .typing-indicator {
            font-size: 12px;
            color: #999;
            padding: 5px 15px;
        }
        
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Users list -->
        <div class="users-list" id="user-list">
            <!-- User items -->
            {% for u in users %}
            <div class="user-item d-flex mb-2" onclick="loadMessages({{ u.id }})" style="cursor: pointer;">
                <div class="user-avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2">
                    {{ u.first_name.0 }}
                </div>
                <div class="user-info w-100">
                    <div class="d-flex justify-content-between">
                        <div class="user-name">{{ u.first_name }} <span style="color: red;">{% if  u.cha_count  > 0 %} {{ u.cha_count }} {% endif %}</span></div>
                        <div class="message-time">{{ u.chats.last.timestamp|date:"H:i" }}</div>  
                    </div>
                    
                </div>
            </div>
            {% endfor %}
        </div>
        
        <!-- Chat area -->
    <div class="chat-container" >
    <!-- Header -->
            <div class="chat-header d-flex align-items-center">
                <div class="me-2 rounded-circle bg-primary" style="width:40px; height:40px;"></div>
                <div>
                    <div id="user-username" class="fw-bold"></div>
        
                </div>
            </div>
            <div id="chat-messages" class="chat-messages d-flex flex-column p-3" style="height: 300px; overflow-y: auto;">

            </div>
            <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content">
                    <div class="modal-body text-center">
                        <img id="modalImage" src="" alt="Kattalashtirilgan rasm" class="img-fluid rounded">
                    </div>
                    </div>
                </div>
            </div>
                            <!-- Input -->
             <div class="chat-input">
                <div class="input-group">
                    <input id="text-input" type="text" class="form-control" style="width: 60% !important;" placeholder="Xabar yozing...">
                   <div id="paste-area" contenteditable="true" class="form-control" style="width: 20% !important;">
                        Ctrl + V
                    </div>

                    <button id="send-button" class="btn btn-primary" type="button">
                        <i class="bi bi-send"></i> Yuborish
                    </button>
                </div>
            </div>
        </div>
       
    </div>
             
                    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>


// function loadUsers() {

// Har 60 sekundda qayta yuklash





    const pasteArea = document.getElementById('paste-area');

    pasteArea.addEventListener('paste', (e) => {
    e.preventDefault();  // Brauzerning default paste funksiyasini to‘xtatamiz

    const items = e.clipboardData.items;
    for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
            const file = items[i].getAsFile();
            pastedImageFile = file;
            selectedFile = null;

            // Rasm qo‘shilmasligi uchun tozalaymiz
            pasteArea.innerHTML = "<b>Yuborng</b>";
            break;
        }
    }
});
        const sendButton = document.getElementById('send-button');
        const textInput = document.getElementById('text-message');
        // const roomId = chatContainer.dataset.roomId; 
        // ENTER bilan rasm yuborish
        pasteArea.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendImage();
            }
        });

        // Ctrl + V orqali rasmni olish
        pasteArea.addEventListener('paste', function (e) {
        const items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (item.type.indexOf("image") !== -1) {
                const file = item.getAsFile();
                const formData = new FormData();
                formData.append('image', file);
                formData.append("room_id", currentUserId );
                 // room_id ni qo‘shish

                fetch('/chta/image/create/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                }).then(response => response.json())
                .then(data => {
                    console.log('Rasm yuborildi:', data);
                    pasteArea.innerHTML = "Ctrl + V";
                    loadMessages(currentUserId);
                });
            }
        }
    });


        // Text yoki rasmni yuborish
document.addEventListener('DOMContentLoaded', function () {
    const sendButton = document.getElementById('send-button');
    const textInput = document.getElementById('text-input');

    sendButton.addEventListener('click', function () {
        const text = textInput.value.trim();
        if (text) {
            fetch('/chat/message/create/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ content: text,room_id: currentUserId  })
            })
            .then(res => res.json())
            .then(data => {
                textInput.value = '';
                console.log('Text yuborildi', data);
                 
                loadMessages(currentUserId);
            });
        }
    });
});



let currentUserId = null;

// Modal rasmni kattalashtirish
document.addEventListener('click', function (e) {
    if (e.target.tagName === 'IMG' && e.target.closest('.message-text')) {
        const modalImage = document.getElementById('modalImage');
        modalImage.src = e.target.src;
        const imageModal = new bootstrap.Modal(document.getElementById('imageModal'));
        imageModal.show();
    }
});

function loadMessages(userId) {
    currentUserId = userId;
    fetch(`/get-messages/${userId}/`)
        .then(response => response.json())
        .then(data => {
            const chatBox = document.getElementById('chat-messages');
            const user = document.getElementById('user-username');
            user.innerHTML = '';

            const username = document.createElement('div');
            username.classList.add('fw-bold');
            username.textContent = data.user;
            user.appendChild(username);

            // Xabarlar bo‘limini tozalash
            chatBox.innerHTML = '';
            data.messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', msg.is_sent_by_me ? 'received' : 'sent');

                let messageHTML = '';
                if (msg.content) {
                    messageHTML += `<div class="message-text">${msg.content}</div>`;
                } else if (msg.image) {
                    messageHTML += `<div class="message-text">
                        <img src="${msg.image}" alt="rasm" class="img-fluid rounded" style="max-width: 200px;">
                    </div>`;
                }

                messageHTML += `<div class="message-time"><span>${msg.admin}</span> ${msg.time}</div>`;
                messageDiv.innerHTML = messageHTML;
                chatBox.appendChild(messageDiv);
            });

            // Foydalanuvchilar ro‘yxatini yangilash
            const usersList = document.getElementById('user-list');
            usersList.innerHTML = ''; // eski userlarni tozalash

            data.users.forEach(u => {
                const html = `
                    <div class="user-item d-flex mb-2" onclick="loadMessages(${u.id})" style="cursor: pointer;">
                        <div class="user-avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2">
                            ${u.first_name[0]}
                        </div>
                        <div class="user-info w-100">
                            <div class="d-flex justify-content-between">
                                <div class="user-name">
                                    ${u.first_name}
                                    <span style="color: red;">${u.count > 0 ? u.count : ''}</span>
                                </div>
                                <div class="message-time">${u.last_time}</div>
                            </div>
                        </div>
                    </div>
                `;
                usersList.innerHTML += html;
            });

            // Skrollni pastga tushirish
            chatBox.scrollTop = chatBox.scrollHeight;
        })
        .catch(error => {
            console.error("Xabarlarni yuklashda xatolik:", error);
        });
}

// ⏱ Har 30 soniyada avtomatik yangilash
setInterval(() => {
    if (currentUserId !== null) {
        loadMessages(currentUserId);
    }
}, 10000);





    </script>
</body>
</html>

{% extends 'base_filial.html' %}
{% load static %}

{% block content %}
<div class="container">
    <h2>Mahsulotni Tahrirlash</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        {{ form.media }}
        
        <div class="form-group">
            {{ form.uid }}
        </div>
        
        <div class="form-group">
            {{ form.info }}
        </div>
        
        
        <button type="submit" class="btn btn-primary">Saqlash</button>
    </form>
</div>
<hr>


{% endblock %}

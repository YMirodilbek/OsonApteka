{% extends 'website_dashboard/web_base.html' %}

{% block title %}Public Offer - AkmalFarm{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">Ommaviy Offerta</h2>
                </div>
                <div class="card-body">
                    <form action="{% url 'publicUpdate' %}" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Matn</label>
                            <textarea class="form-control" name="body" rows="10" required>{{ public.body|default:'' }}</textarea>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-2"></i>Saqlash
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

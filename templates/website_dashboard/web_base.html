<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AkmalFarm Boshqaruv{% endblock %}</title>
    {% load static %}
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --main-color: #022b5f;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
        }
        .nav-link {
            color: #495057;
        }
        .nav-link:hover {
            background-color: #e9ecef;
        }
        .nav-link.active {
            background-color: var(--main-color);
            color: white;
        }
        .content {
            padding: 20px;
        }
        .btn-primary {
            background-color: var(--main-color);
            border-color: var(--main-color);
        }
        .btn-primary:hover {
            background-color: #011d4d;
            border-color: #011d4d;
        }
        .btn-info {
            background-color: var(--main-color);
            border-color: var(--main-color);
        }
        .btn-info:hover {
            background-color: #011d4d;
            border-color: #011d4d;
        }
        .logo-container {
            padding: 1rem;
            text-align: center;
        }
        .logo-container img {
            max-width: 100%;
            height: auto;
            max-height: 80px;
        }
        @media (max-width: 768px) {
            .sidebar {
                min-height: auto;
                border-right: none;
                border-bottom: 1px solid #dee2e6;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0 sidebar">
                <div class="p-3">
                    <div class="logo-container">
                        <img src="{% static 'media/AFM MEDICAL.png' %}" alt="AkmalFarm Logo">
                    </div>
                    <nav class="nav flex-column">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_url' %}active{% endif %}" href="{% url 'dashboard_url' %}">
                            <i class="bi bi-speedometer2 me-2"></i>Boshqaruv
                        </a>
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_vacancy_url' %}active{% endif %}" href="{% url 'dashboard_vacancy_url' %}">
                            <i class="bi bi-briefcase me-2"></i>Vakansiyalar
                        </a>
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_pharmacy_url' %}active{% endif %}" href="{% url 'dashboard_pharmacy_url' %}">
                            <i class="bi bi-shop me-2"></i>Aptekalar
                        </a>
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_landlords_url' %}active{% endif %}" href="{% url 'dashboard_landlords_url' %}">
                            <i class="bi bi-building me-2"></i>Ijara beruvchilar
                        </a>
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_blog' %}active{% endif %}" href="{% url 'dashboard_blog' %}">
                            <i class="bi bi-newspaper me-2"></i>Blog
                        </a>
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_about_url' %}active{% endif %}" href="{% url 'dashboard_about_url' %}">
                            <i class="bi bi-info-circle me-2"></i>Biz haqimizda
                        </a>
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard_public_url' %}active{% endif %}" href="{% url 'dashboard_public_url' %}">
                            <i class="bi bi-file-text me-2"></i>Ommaviy taklif
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 content">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Yopish"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
